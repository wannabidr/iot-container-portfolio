<!doctype html>
<html lang="ko">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><meta name="theme-color" content="#0b1320"><title>방명록 관리 — 김성욱</title><link rel="icon" href="/favicon.svg" type="image/svg+xml"><link rel="stylesheet" href="/styles.css"><script src="/admin.js" defer></script></head>
<body><a class="skip-link" href="#main">본문으로 바로가기</a><header class="site-header"><div class="shell header-inner"><a class="wordmark" href="/"><span class="monogram">SK<span>.</span></span><span>김성욱</span></a><a class="text-link" href="/">포트폴리오로 돌아가기 ↗</a></div></header>
<main id="main" class="shell section admin-main"><p class="eyebrow">GUESTBOOK / ADMINISTRATION</p><h1>방명록 관리</h1><p class="admin-description">관리자 인증 후 메시지를 확인하고 정리할 수 있습니다.</p><div class="admin-layout"><section class="admin-auth" aria-labelledby="auth-title"><h2 id="auth-title">관리자 인증</h2><form id="admin-form"><label for="admin-key">관리자 인증키</label><input id="admin-key" name="key" type="password" required autocomplete="off" spellcheck="false" placeholder="관리자 인증키 입력" aria-describedby="key-note"><p id="key-note" class="form-note">인증키는 이 화면을 사용하는 동안만 유지되며 브라우저에 저장하지 않습니다.</p><button id="login-button" class="button button-primary" type="submit">인증하기 <span aria-hidden="true">→</span></button></form><button id="logout-button" type="button" class="button button-outline" hidden>관리 종료</button><p id="auth-status" role="status" class="status" aria-live="polite"></p></section><section class="admin-entries" aria-labelledby="entries-title"><div class="feed-heading"><h2 id="entries-title">메시지 목록</h2><button id="admin-refresh" type="button" class="text-link" hidden>새로고침 ↻</button></div><p id="admin-feed-status" class="status" role="status" aria-live="polite">인증하면 메시지 목록이 표시됩니다.</p><div id="admin-notes"></div><button id="admin-more" type="button" class="button button-outline" hidden>이전 메시지 더 보기</button></section></div><noscript><p>관리자 기능에는 JavaScript가 필요합니다.</p></noscript></main>
<dialog id="delete-dialog" aria-labelledby="delete-title" aria-describedby="delete-description"><h2 id="delete-title">메시지를 삭제할까요?</h2><p id="delete-description"></p><p class="form-note">삭제한 메시지는 되돌릴 수 없습니다.</p><div class="dialog-actions"><button type="button" id="cancel-delete" class="button button-outline">취소</button><button type="button" id="confirm-delete" class="button button-primary">삭제하기</button></div></dialog>
<footer class="site-footer shell"><p>김성욱 · PORTFOLIO</p><a class="text-link" href="/">포트폴리오로 돌아가기 ↗</a></footer></body>
</html>
