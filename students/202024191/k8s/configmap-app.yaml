              <li><time>2025.07 — 현재</time><div><span class="timeline-status">연구·개발</span><h3>그래픽스 및 기하처리 연구실</h3><p class="timeline-role">부산대학교 · 학부연구생 · 에이전트팀장</p><p>해운물류 도메인 지식 특화 에이전트 개발 과제를 수행합니다. 자연어 3D 모델링과 CAD 생성 등을 포함한 에이전트 프로젝트 4개를 운영하며 MCP, Google ADK, n8n을 활용한 경험을 쌓고 있습니다.</p></div></li>
              <li><time>2025.09 — 2025.12</time><div><h3>에이전트 마중나가기</h3><p class="timeline-role">정보컴퓨터공학부 학술동아리 AID · 스터디팀장</p><p>에이전트 시장과 기반 기술을 분석하는 스터디를 주관했습니다.</p></div></li>
              <li><time>2025.03 — 2025.08</time><div><h3>AX 앞서가기</h3><p class="timeline-role">정보컴퓨터공학부 학술동아리 AID · 스터디팀장</p><p>LLM 모델과 AI 서비스 활용을 함께 탐구하고, Cursor 등 AI 개발 도구를 실제 개발 과정에 활용하는 스터디를 주관했습니다.</p></div></li>
              <li><time>2023.09 — 2025.01</time><div><h3>레이어코퍼레이션</h3><p class="timeline-role">CTO · 공동창업자</p><p>WORKWAY의 개발을 총괄하며 서비스 아키텍트와 TPM 역할을 수행했습니다. GCP Serverless와 Android·iOS 네이티브 앱을 개발·운영했습니다.</p></div></li>
              <li><time>2022.11 — 2023.08</time><div><h3>PlayGround</h3><p class="timeline-role">부산대학교 창업동아리 · 개발팀장</p><p>창업동아리의 개발팀을 이끌며 제품을 만드는 경험을 시작했습니다.</p></div></li>
            </ol>
          </div>
        </section>

        <section class="section shell" id="leadership" aria-labelledby="leadership-title">
          <div class="section-heading"><div><p class="eyebrow">03 — LEARNING TOGETHER</p><h2 id="leadership-title">만드는 경험을,<br>함께 나누는 경험으로.</h2></div><p class="section-description">스터디와 강연을 통해<br>개발 방식의 변화를 함께 고민합니다.</p></div>
          <article class="talk-card"><div class="talk-date"><span>2025</span><strong>09.19</strong><span>AID SEMINAR</span></div><div><p class="eyebrow">TALK</p><h3>20년 공부하고<br>딸깍으로 대체되기</h3><p>바이브코딩과 AI와 공존하는 방법에 대한 강연.<br>정보컴퓨터공학부 학술동아리 AID 세미나에서 개발자의 역할과 AI 활용 방식을 이야기했습니다.</p></div><span class="talk-mark" aria-hidden="true">“</span></article>
          <div class="skills-map"><div><h3>경험에서 이어지는 기술</h3><p>도구의 이름보다, 무엇에 사용했는지를 중요하게 생각합니다.</p></div><dl><div><dt>AI Agent</dt><dd>MCP · Google ADK · n8n<span>연구실 에이전트 개발·운영 경험</span></dd></div><div><dt>Mobile &amp; IoT</dt><dd>Kotlin · Swift · Bluetooth<span>WORKWAY의 네이티브 앱과 웨어러블 연동</span></dd></div><div><dt>Cloud</dt><dd>GCP · Firebase · Azure<span>WORKWAY 서비스와 클라우드 팀 프로젝트</span></dd></div><div><dt>AI-assisted Development</dt><dd>Cursor · AI 개발 도구<span>AID 스터디와 AI 활용 개발 프로젝트</span></dd></div></dl></div>
        </section>

        <section class="guestbook-section" id="guestbook" aria-labelledby="guestbook-title">
          <div class="shell section"><div class="section-heading"><div><p class="eyebrow">04 — SAY HELLO</p><h2 id="guestbook-title">함께 나누고 싶은<br>이야기가 있나요?</h2></div><p class="section-description" id="guestbook-description">프로젝트에 대한 생각이나 짧은 인사를 남겨 주세요.<br>메시지는 이 페이지에 공개됩니다.</p></div>
            <div class="guestbook-layout"><form id="guestbook-form" class="guestbook-form"><div class="form-heading"><span>LEAVE A NOTE</span><span aria-hidden="true">↗</span></div><label for="guest-name">이름 또는 닉네임</label><input id="guest-name" name="name" required maxlength="40" autocomplete="nickname" placeholder="어떻게 불러 드릴까요?"><div class="label-row"><label for="guest-message">메시지</label><span id="message-count">0 / 500</span></div><textarea id="guest-message" name="message" required maxlength="500" rows="5" aria-describedby="privacy-note message-count" placeholder="편하게 이야기를 남겨 주세요."></textarea><p id="privacy-note" class="form-note">연락처 등 개인정보는 남기지 말아 주세요.<br>이름과 메시지가 공개되며 관리자가 삭제할 수 있습니다.</p><button type="submit" class="button button-primary" id="submit-note">메시지 남기기 <span aria-hidden="true">↗</span></button><p id="form-status" class="status" role="status" aria-live="polite"></p></form>
              <div class="guestbook-feed"><div class="feed-heading"><h3>남겨 주신 이야기</h3><button type="button" class="text-link" id="refresh-notes">새로고침 <span aria-hidden="true">↻</span></button></div><p id="feed-status" class="status" role="status" aria-live="polite">메시지를 불러오고 있습니다.</p><div id="notes-list" aria-label="방명록 목록"></div><button id="load-more" class="button button-outline" type="button" hidden>이전 메시지 더 보기</button><noscript><p>방명록 조회와 작성에는 JavaScript가 필요합니다.</p></noscript></div></div>
          </div>
        </section>
      </main>
